name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build fat-jar with Maven
        run: mvn clean package "-Dmaven.test.skip=true"

      - name: Package EXE with jpackage
        run: jpackage --input target --name PdfSplitter --main-jar PdfSplitter-1.0.jar --main-class com.mrc.PdfSplitter --type exe --win-console --dest output

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PdfSplitter-Windows-EXE
          path: output/*.exe
